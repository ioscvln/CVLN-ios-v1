invariants:
  - id: INV-001
    rule: no row may carry IMPLEMENTED or VERIFIED without an evidence path
  - id: INV-002
    rule: every decision D-001..D-014 has an ADR document
  - id: INV-003
    rule: markdown remains the canonical store; no database mirrors the corpus
  - id: INV-004
    rule: the contradictions register is non-empty and C-002 remains open
  - id: INV-005
    rule: every document declares a status from the canonical vocabulary
  - id: INV-006
    rule: JCC is never described as currency or a payment instrument
  - id: INV-007
    rule: no v1.0 document was deleted
  - id: INV-008
    rule: every registry row has exactly one status cell
  - id: INV-009
    rule: Kiltikonet exists in the ecosystem registry
  - id: INV-010
    rule: the Kiltikonet system card exists and is reachable
  - id: INV-011
    rule: every Kiltikonet relation row is traceable and evidence-backed
  - id: INV-012
    rule: Kiltikonet historical contradictions are recorded and open
  - id: INV-013
    rule: no internal Markdown reference added after v1.0 is broken (v1.0 links are frozen and reported only)
  - id: INV-014
    rule: every Kiltikonet programme carries its own status
  - id: INV-015
    rule: every freeze-blocker in the open-questions register carries an owner field and a due field
  - id: INV-016
    rule: no anchoring artefact is described as a qualified or eIDAS timestamp
  - id: INV-017
    rule: the drift history is continuous - every recorded patch keeps its own baseline snapshot
unverified_claims_policy: "IMPLEMENTED never implies VERIFIED"
